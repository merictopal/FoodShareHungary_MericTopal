[pytest]
# Only the in-process suites under tests/ are collected by default.
# backend/test_api.py is a legacy live-server script (needs `flask run` on :5000) and is NOT collected.
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: fast, read-only checks that the app boots and core endpoints answer with the right shape
    edge: edge-case / robustness checks (bad input, auth abuse, IDOR, known-bug guards)
    writes: opt-in flows that INSERT/DELETE @fs-test.local data (FS_ALLOW_WRITES=1); never part of the gate
xfail_strict = true
